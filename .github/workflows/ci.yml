
name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: test -f index.html

      - name: Build Website
        run: echo "Website Build Successful"

      - name: Show Success Message
        run: echo "CI Pipeline Completed"
